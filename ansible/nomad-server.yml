---
- name: Install HashiCorp Nomad
  hosts: nomad_servers
  become: true
  gather_facts: true

  roles:
    - role: general
      tags:
        - general
    - hashicorp_repo
    - role: vault_agent
      tags:
        - vault_agent
      vars:
        vault_agent_marker_name: nomad-server
        vault_agent_certificates:
          - name: nomad-server
            cert_request: nomad_cert_request
            common_name: server.global.nomad
            ip_sans: 127.0.0.1,{{ ansible_facts['default_ipv4']['address'] }}
            alt_names: nomad.home,localhost
            command: systemctl reload nomad
            product: nomad

    - role: nomad
      tags:
        - nomad

    - role: nomad_server
      tags:
        - nomad_server
