---
- name: Allow Vault TCP ports through UFW
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop:
    - 8200
    - 8201
  tags:
    - firewall

- name: Create the Vault configuration directory
  ansible.builtin.file:
    path: /etc/vault.d
    state: directory
    owner: vault
    group: vault
    mode: '0750'

- name: Create the Vault raft data directory
  ansible.builtin.file:
    path: /opt/vault/raftdb
    state: directory
    owner: vault
    group: vault
    mode: '0750'

- name: Create the Vault log directory
  ansible.builtin.file:
    path: /var/log/vault
    state: directory
    owner: vault
    group: vault
    mode: '0750'

- name: Install the Vault server configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: vault
    group: vault
    mode: '0640'
  diff: false
  notify: Restart Vault

- name: Enable and start Vault
  ansible.builtin.systemd_service:
    name: vault
    enabled: true
    state: started
