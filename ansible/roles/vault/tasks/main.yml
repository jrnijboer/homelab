---
- name: Install Vault
  ansible.builtin.apt:
    name: vault
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Keep Vault stopped and disabled
  ansible.builtin.systemd_service:
    name: vault
    state: stopped
    enabled: false

- name: Allow Vault TCP ports through UFW
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop:
    - 8200
    - 8201
