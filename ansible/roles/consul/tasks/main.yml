---
- name: Install Consul
  ansible.builtin.apt:
    name: consul
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Keep Consul stopped and disabled
  ansible.builtin.systemd_service:
    name: consul
    state: stopped
    enabled: false

- name: Allow Consul TCP ports through UFW
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop:
    - 8300
    - 8301
    - 8302
    - 8500
    - 8501
    - 8502
    - 8503
    - 8600

- name: Allow Consul UDP ports through UFW
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: udp
  loop:
    - 8301
    - 8302
    - 8600
