---
- name: Install Nomad
  ansible.builtin.apt:
    name: nomad
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Keep Nomad stopped and disabled
  ansible.builtin.systemd_service:
    name: nomad
    state: stopped
    enabled: false

- name: Allow Nomad TCP ports through UFW
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop:
    - 4646
    - 4647
    - 4648

- name: Allow Nomad UDP ports through UFW
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: udp
  loop:
    - 4648
