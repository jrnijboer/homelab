---
- name: Verify the host runs Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: This role supports Ubuntu hosts only.

- name: Find legacy APT source list files
  ansible.builtin.find:
    paths: /etc/apt
    patterns: '*.list'
    recurse: true
    file_type: file
  register: hashicorp_legacy_source_lists

- name: Remove legacy HashiCorp entries superseded by the managed repository
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*deb(?:-src)?\s+.*https?://apt\.releases\.hashicorp\.com(?:/|\s)'
    state: absent
  loop: "{{ hashicorp_legacy_source_lists.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install APT repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install the HashiCorp APT signing key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: '0644'

- name: Configure the HashiCorp APT repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /etc/apt/keyrings/hashicorp.asc
    state: present
