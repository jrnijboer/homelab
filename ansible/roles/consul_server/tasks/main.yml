---
- name: Validate the Consul bind address
  ansible.builtin.assert:
    that:
      - ansible_facts['default_ipv4']['address'] is match('^192\.168\.179\.')
    fail_msg: >-
      The default-route address {{ ansible_facts['default_ipv4']['address'] }}
      is not in 192.168.179.0/24.

- name: Create the Consul configuration directory
  ansible.builtin.file:
    path: /etc/consul.d
    state: directory
    owner: consul
    group: consul
    mode: '0750'

- name: Create the Consul log directory
  ansible.builtin.file:
    path: /var/log/consul
    state: directory
    owner: consul
    group: consul
    mode: '0750'

- name: Install the Consul server configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: '0640'
  diff: false
  notify: Restart Consul

- name: Enable and start Consul server
  ansible.builtin.systemd_service:
    name: consul
    state: started
    enabled: true
