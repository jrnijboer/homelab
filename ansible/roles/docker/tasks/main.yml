---
- name: Verify the host runs Ubuntu or Debian
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    fail_msg: This role supports Ubuntu and Debian hosts only.

- name: Install Docker repository and API prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
      - python3-requests
    state: present
    update_cache: true

- name: Get the host APT architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_apt_architecture
  changed_when: false
  check_mode: false

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the Docker APT signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure the Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_apt_architecture.stdout }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Remove the superseded Docker list-format repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install Docker Engine without upgrading existing packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Read any existing Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_existing
  failed_when: false

- name: Install the Docker daemon configuration with log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: "{{ (docker_daemon_existing.content | default('e30=') | b64decode | from_json) | combine(docker_daemon_log_config, recursive=true) | to_nice_json }}\n"
    validate: dockerd --validate --config-file=%s
  notify: Restart Docker

- name: Start Docker and enable it at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true